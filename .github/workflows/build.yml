name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # The macOS app is signed with a Developer ID certificate and notarized by Apple only for
      # releases (a tag) and manual runs, and only when the signing secrets exist. Pull requests
      # from forks never get secrets, so they still build with an ad-hoc signature.
      NOTARIZE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && secrets.APPLE_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: RustSIPPhone-macos
          - name: Windows
            os: windows-latest
            artifact: RustSIPPhone-windows
          - name: Linux
            os: ubuntu-22.04
            artifact: RustSIPPhone-linux

    steps:
      - uses: actions/checkout@v6

      # Third-party actions are pinned to a commit hash, not to a movable tag.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libssl-dev

      - name: Tests
        run: cargo test

      # ---------- macOS: universal app (Apple Silicon + Intel) in a .dmg
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.NOTARIZE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain that only lives for this job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Let codesign use the key without a prompt (there is nobody to click "Allow").
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign and notarize (.app and .dmg)
        if: runner.os == 'macOS' && env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/bundle-macos.sh --universal --dmg --notarize

      - name: Build .app and .dmg (ad-hoc signature)
        if: runner.os == 'macOS' && env.NOTARIZE != 'true'
        run: ./scripts/bundle-macos.sh --universal --dmg

      - name: Remove the temporary keychain
        if: always() && runner.os == 'macOS' && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp dist/*.dmg out/

      # ---------- Windows: .exe with icon in a zip
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path target/release/rust_sip_phone.exe -DestinationPath out/RustSIPPhone-windows.zip

      # ---------- Linux: binary + desktop entry + icon in a tar.gz
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out stage/RustSIPPhone
          cp target/release/rust_sip_phone stage/RustSIPPhone/
          cp packaging/linux/rustsipphone.desktop stage/RustSIPPhone/
          cp assets/icon.png stage/RustSIPPhone/rustsipphone.png
          tar -C stage -czf out/RustSIPPhone-linux-x86_64.tar.gz RustSIPPhone

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Write checksums
        working-directory: out
        run: sha256sum RustSIPPhone-* > SHA256SUMS.txt

      # No third-party actions here: the release is created with the official gh CLI.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --generate-notes
