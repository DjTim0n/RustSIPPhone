name: Сборка

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: RustSIPPhone-macos
          - name: Windows
            os: windows-latest
            artifact: RustSIPPhone-windows
          - name: Linux
            os: ubuntu-22.04
            artifact: RustSIPPhone-linux

    steps:
      - uses: actions/checkout@v4

      # Сторонние действия закреплены по хэшу коммита, а не по подвижному тегу.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # ветка stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Системные пакеты (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libssl-dev

      - name: Тесты
        run: cargo test

      # ---------- macOS: универсальное приложение (Apple Silicon + Intel) в .dmg
      - name: Сборка .app и .dmg
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh --universal --dmg

      - name: Упаковка (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp dist/*.dmg out/

      # ---------- Windows: .exe с иконкой в zip
      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path target/release/rust_sip_phone.exe -DestinationPath out/RustSIPPhone-windows.zip

      # ---------- Linux: бинарник + ярлык + иконка в tar.gz
      - name: Сборка (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release

      - name: Упаковка (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out stage/RustSIPPhone
          cp target/release/rust_sip_phone stage/RustSIPPhone/
          cp packaging/linux/rustsipphone.desktop stage/RustSIPPhone/
          cp assets/icon.png stage/RustSIPPhone/rustsipphone.png
          tar -C stage -czf out/RustSIPPhone-linux-x86_64.tar.gz RustSIPPhone

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: Релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Write checksums
        working-directory: out
        run: sha256sum RustSIPPhone-* > SHA256SUMS.txt

      # No third-party actions here: the release is created with the official gh CLI.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --generate-notes
